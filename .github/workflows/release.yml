name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Publish (NativeAOT)
        run: dotnet publish GitShadowtree/GitShadowtree.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item publish/git-shadowtree.exe staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "git-shadowtree-$version-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "git-shadowtree-${{ steps.version.outputs.version }}-win-x64.zip" --title "git shadowtree ${{ steps.version.outputs.version }}" --generate-notes

      - name: Publish to Windows Package Manager
        shell: pwsh
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/szv/git-shadowtree/releases/download/v$version/git-shadowtree-$version-win-x64.zip"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Szv.GitShadowtree --version $version --urls "$url" --submit --token $env:WINGET_TOKEN
