name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release (win-x64)
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.hash.outputs.hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Publish (NativeAOT)
        run: dotnet publish GitShadowtree/GitShadowtree.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item publish/git-shadowtree.exe staging/
          Copy-Item README.md, LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath "git-shadowtree-$version-win-x64.zip"

      - name: Compute hash
        id: hash
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $hash = (Get-FileHash "git-shadowtree-$version-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "git-shadowtree-${{ steps.version.outputs.version }}-win-x64.zip" --title "git shadowtree ${{ steps.version.outputs.version }}" --generate-notes

  winget:
    name: Publish to Windows Package Manager
    needs: build
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Publish to Windows Package Manager
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $url = "https://github.com/szv/git-shadowtree/releases/download/v$version/git-shadowtree-$version-win-x64.zip"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Szv.GitShadowtree --version $version --urls "$url" --submit --token $env:WINGET_TOKEN

  scoop:
    name: Update Scoop manifest
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Scoop manifest
        shell: pwsh
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $hash = "${{ needs.build.outputs.hash }}"
          $url = "https://github.com/szv/git-shadowtree/releases/download/v$version/git-shadowtree-$version-win-x64.zip"

          git fetch origin main
          git checkout -B main origin/main

          $path = "scoop/git-shadowtree.json"
          $manifest = Get-Content $path -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = $url
          $manifest.architecture.'64bit'.hash = "sha256:$hash"
          $manifest | ConvertTo-Json -Depth 100 | Set-Content $path -Encoding utf8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Scoop manifest already up to date."; exit 0 }
          git commit -m "Update Scoop manifest to $version"
          git push origin main
